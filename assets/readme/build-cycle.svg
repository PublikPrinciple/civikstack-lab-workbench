<svg xmlns="http://www.w3.org/2000/svg" width="720" height="256" viewBox="0 0 720 256" role="img" aria-labelledby="title desc">
  <title id="title">Define, Build, Test, Reduce</title>
  <desc id="desc">A four-step cycle: define the task and success criteria; build its environment; test against evidence; reduce complexity while preserving the tested behavior, then repeat.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#ff8a52"/></marker>
  </defs>
  <rect width="720" height="256" rx="14" fill="#101114"/>
  <g fill="#18191d" stroke="#ff612f" stroke-width="2">
    <rect x="20" y="20" width="300" height="88" rx="10"/>
    <rect x="400" y="20" width="300" height="88" rx="10"/>
    <rect x="400" y="148" width="300" height="88" rx="10"/>
    <rect x="20" y="148" width="300" height="88" rx="10"/>
  </g>
  <g fill="none" stroke="#ff8a52" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M332 64H385"/><path d="M550 116V135"/>
    <path d="M388 192H335"/><path d="M170 140V121"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#fff1e9" text-anchor="middle">
    <text x="170" y="76">Define</text><text x="550" y="76">Build</text>
    <text x="550" y="204">Test</text><text x="170" y="204">Reduce</text>
  </g>
  <g font-family="Consolas, monospace" font-size="14" fill="#ffab87">
    <text x="35" y="44">01</text><text x="415" y="44">02</text>
    <text x="415" y="172">03</text><text x="35" y="172">04</text>
  </g>
</svg>
