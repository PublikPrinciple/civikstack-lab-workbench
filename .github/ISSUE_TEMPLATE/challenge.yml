name: Task environment experiment
description: Propose one bounded task-environment change and how to evaluate it.
title: "[Challenge] "
body:
  - type: textarea
    id: evidence
    attributes:
      label: Access finding and evidence
      description: Link reviewed sources, or explicitly label this as synthetic.
    validations:
      required: true
  - type: textarea
    id: capability
    attributes:
      label: Task environment, component change, and intended behavior
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Package version, input/output contract, route, and dependencies
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance tests and evidence required
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Permissions, isolation, uncertainty, and compute boundaries
      value: "Approved public-safe or synthetic data only. Preserve unknowns. Current local runner is not a sandbox. Production <=1B versus prior 7B planning remains unresolved; use the no-model baseline pending owner decision."
    validations:
      required: true
